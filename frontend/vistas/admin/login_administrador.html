<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Panel de Administración</title>
    <link rel="stylesheet" href="/css/login_administrador.css">
</head>
<body>
    <!-- Contenedor principal centrado con Flexbox -->
    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Panel de <span>Administración</span></h1>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <!-- Formulario de inicio de sesión -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@tucorreo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-ingresar">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <a href="/">← Volver al sitio principal</a>
            </div>
        </div>
    </main>
</body>
</html>
